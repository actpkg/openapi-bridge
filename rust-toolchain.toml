# 1.100.0-beta: wasm32-wasip3 is tier 2 starting with 1.100 (stable lands
# 2026-11-12); pinned to the exact beta so the channel does not silently
# move to 1.101.0-beta after stabilization. Revisit on 1.100 release:
# either flip to stable "1.100.0" or follow the next beta deliberately.
# Precedent: scrape + 12 components on this recipe (time, crypto, encoding,
# random, barcode, pdf-inspector, sed, filesystem, http-client, search-brave,
# search-searxng, search-yandex).
[toolchain]
channel = "1.100.0-beta"
targets = ["wasm32-wasip3"]
components = ["rustfmt", "clippy"]
