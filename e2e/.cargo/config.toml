# This crate is host-only test code: it spawns `act` and a stub HTTP server
# over tokio's process/net, which do not exist on wasm. The component root's
# .cargo/config.toml defaults every build in this tree to wasm32-wasip2
# (`just build` relies on that), so pin the host target here — a nearer
# config file wins — and a bare `cargo test` in e2e/ does the right thing.
[build]
target = "x86_64-unknown-linux-gnu"

# One shared build-dir machine-wide (~/.cargo/config.toml redirects it) collides
# same-name crates; pin this crate to its own target/ (relative = crate dir).
build-dir = "target"
