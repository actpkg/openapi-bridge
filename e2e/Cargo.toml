[package]
name = "e2e-openapi-bridge"
version = "0.1.0"
edition = "2024"
publish = false

# Detach from any outer workspace this component may sit in.
[workspace]

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-child-process"] }
# `net` is not in the scaffold's list: the credential-presentation tests run a
# local echo API (a TcpListener serving OpenAPI documents), and the petstore
# reachability probe opens a TcpStream.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
serde_json = "1"
