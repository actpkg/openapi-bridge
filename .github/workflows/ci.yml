name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg, just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: just init
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/*.wasm

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg, just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt -- --check
      - run: just init
      - run: cargo clippy -- -D warnings
      # The target has to be named. `.cargo/config.toml` defaults every cargo
      # invocation here to wasm32-wasip2, and nothing on the runner can
      # execute a wasm test binary, so a bare `cargo test` fails at exec.
      # These are the tests that assert the open-args schema offers nowhere to
      # put a credential, and that a security scheme maps to the header the
      # document declares — so they must run somewhere that blocks a merge.
      - run: cargo test --target x86_64-unknown-linux-gnu

  e2e:
    name: E2E Test
    needs: build
    runs-on: ubuntu-latest
    services:
      # Local Swagger Petstore v3 — avoids the public petstore3.swagger.io
      # flakiness that hands us HTTP 500s on test runs.
      petstore:
        image: swaggerapi/petstore3:unstable
        ports:
          - 8080:8080
    env:
      PETSTORE_SPEC: http://localhost:8080/api/v3/openapi.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg, just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - run: just init
      # e2e/conftest.py's `petstore_spec_url` fixture does its own
      # curl-retry-equivalent wait before any test opens a session, so it no
      # longer needs to happen as a separate CI step first — it holds for a
      # local `just test` run too, not only when this step ran before it.
      - run: just test

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout
      id-token: write     # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: component.wasm
          path: target/wasm32-wasip2/release/
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg, just
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2   # defaults to cosign 3.x → OCI 1.1 referrer signatures
      - run: just init
      - name: Publish
        id: publish
        env:
          # actpkg.dev PAT (any username; the registry detects the PAT by prefix).
          OCI_USERNAME: __token__
          OCI_PASSWORD: ${{ secrets.ACTPKG_TOKEN }}
          # Source repo URL for org.opencontainers.image.source (read by act-build).
          ACT_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: just publish
      - name: Sign (keyless via GitHub OIDC)
        if: steps.publish.outputs.digest != ''
        env:
          ACTPKG_TOKEN: ${{ secrets.ACTPKG_TOKEN }}
          SUBJECT: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
        run: |
          echo "$ACTPKG_TOKEN" | cosign login actpkg.dev -u __token__ --password-stdin
          cosign sign --yes "$SUBJECT"
